<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TabSaver</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="nav">
        <div class="nav__left">
            <img src="icon.png" alt="icon" class="icon">
            <h1 class="nav__text">TabSaver</h1>
            <p id="counter-el"></p>
        </div>
    </div>
    <div class="divider"></div>
    
    <input type="text" id="input-el" placeholder="Enter the link...">
    <div class="buttons">
        <button id="input-btn">SAVE INPUT</button>
        <button id="tab-btn">SAVE TAB</button>
    </div>
    <button id="delete-btn">DELETE ALL</button>

    <div class="divider"></div>

    <ul id="ul-el"></ul>



    <script src="index.js"></script>
</body>
</html>
